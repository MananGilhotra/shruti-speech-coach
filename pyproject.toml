[project]
name = "shruti"
version = "0.1.0"
description = "SHRUTI: contrastive speech-delivery analytics with temporal flaw grounding"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "soxr>=0.3",
  "librosa>=0.10",
  "praat-parselmouth>=0.4.3",
  "torch>=2.2",
  "transformers>=4.40",
  "statsmodels>=0.14",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "cmudict>=1.0",
  "pronouncing>=0.2",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]
tts = ["piper-tts>=1.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
shruti = "shruti.cli:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B006"]
ignore = ["E731", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
